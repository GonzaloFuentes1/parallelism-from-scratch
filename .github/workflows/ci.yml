name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff lint
        run: uvx ruff check .
      - name: Ruff format
        run: uvx ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create environment
        run: uv venv --python ${{ matrix.python-version }} .venv
      - name: Install CPU-only torch
        run: uv pip install --python .venv torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: uv pip install --python .venv -e ".[dev]"
      - name: Versions
        run: .venv/bin/python -c "import sys, torch; print(sys.version); print(torch.__version__)"
      - name: Tests
        run: .venv/bin/python -m pytest -v --durations=10
